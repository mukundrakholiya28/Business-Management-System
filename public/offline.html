<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offline — Shree Royal Car</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #F4F5F7;
      font-family: -apple-system, BlinkMacSystemFont, "Inter", system-ui, sans-serif;
      color: #1A1D27;
    }
    .card {
      background: #fff;
      border-radius: 16px;
      padding: 2.5rem 2rem;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
      text-align: center;
      max-width: 380px;
      width: 90%;
    }
    .icon { font-size: 3rem; margin-bottom: 1rem; }
    h1 { font-size: 1.25rem; font-weight: 700; margin-bottom: 0.5rem; }
    p { font-size: 0.875rem; color: #6B7280; line-height: 1.6; margin-bottom: 1.5rem; }
    button {
      background: #1A1D27;
      color: #fff;
      border: none;
      padding: 0.625rem 1.5rem;
      border-radius: 10px;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: #2d3148; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">📡</div>
    <h1>You're Offline</h1>
    <p>
      This page isn't available offline yet. Open the app while connected at least once
      to enable full offline access.
    </p>
    <p>
      Your locally saved data — invoices, customers, and vehicles — is still accessible.
      Navigate to a page you've already visited.
    </p>
    <button onclick="window.location.reload()">Try Again</button>
  </div>
</body>
</html>
